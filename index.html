const TALES={
harbor:{title:"The Speaking Prow",epi:["Know thyself.","carved over the door of the god at Delphi"],tale:[
"Long before any ship crossed this sea, there was a harbour where the water lay so still that it held the whole sky. The shipwrights who worked there did not build boats for trade or for war. They built vessels for a single passenger each, and into every one they set a prow carved from the oak of Dodona, the oldest oracle-tree of the old world, whose leaves were said to whisper the will of the gods. The prow could speak. Before the ropes were loosed it asked each traveller one thing: What do you seek?",
"Most travellers answered with a list. They wanted to be healed, to be happy, to see wonders, to wake up as someone else. To each of these the prow answered with silence, and the ship would not leave the quay. The harbour-masters, who had watched this for a thousand years, only smiled and sent them back to the Chart House to try again.",
"The ones who sailed were those who learned to ask instead of demand. What am I not seeing? What have I been carrying? Why am I afraid of stillness? A question is a lighter cargo than a wish. It leaves room in the hold for whatever the sea decides to give.",
"Before the prow would speak at all, the old ones say, the ship had to be made ready. The traveller searched the hull for hidden cracks, because the sea finds every weakness. They chose one companion to stay on the shore with a lamp, sober and awake, so that whatever happened out there, there would be a light to steer home by. They made the cabin warm and quiet and filled it with music chosen days before. Nothing was left to the moment that could be decided in calm.",
"This is the harbour you are standing in now. Every voyage begins here, whether you notice it or not. Your mood tonight, the sleep you had, the quarrel you have not finished, the room around you, the person beside you: all of it is already part of the sea you will sail. Walk the quay slowly. Look at your ship. And when you are ready, let the prow ask its question, and listen carefully to what you answer."]},
sea:{title:"The Song and the Mast",epi:["You will not find the boundaries of the soul, though you travel every road, so deep is its measure.","Heraclitus"],tale:[
"Between the islands lies the wide sea, and it is never the same sea twice. Sailors who have crossed it a hundred times still cannot draw it, because its currents follow the traveller rather than the moon. Calm water can turn in a breath. A storm can open, without warning, into a silence so vast it feels like the first morning of the world.",
"The oldest story told on these waters is the story of the singers on the rocks. Their song was the sweetest thing a human ear could hear, and every ship that turned toward it broke apart on the stones beneath. One captain wanted to hear the song and live. He did not fight it, and he did not flee it. He had his crew bind him to the mast, and he told them: whatever I say, whatever I beg, keep rowing. He heard everything. He wept and raged and pleaded. And the ship sailed on.",
"This is the secret of the crossing. You do not need to fight what rises in you, and you do not need to obey it. Let the song be sung. Let the fear come and speak its piece. Be bound to something steady, your breath, the music, the hand of the one who watches over you, and let the ship keep moving.",
"On this sea you will meet the whirlpool that turns every thought into another thought, the storm that grows wilder the harder you fight it, the fog that steals your name, the small voices calling you back to the shallow world, and the rocks where travellers cling to a beautiful moment until it cuts them. Each has its anchor. None of them is your enemy. They are the sea teaching you how to sail.",
"And if a monster rises from the deep, the sailors’ rule is simple and very old: turn toward it. Look it in the eye and ask what it has come to show you. More often than not, the monster bows its head, slips back beneath the waves, and leaves something floating on the water for you to carry home."]},
senses:{title:"The Lotus Shore",epi:["Taste everything. Forget nothing.","painted on the hull of a ship that never left"],tale:[
"The first island most travellers reach is the loveliest place in the realm. The sand is warm and fine and changes colour as you walk on it. The trees lean toward you when you look at them. Music rises out of the ground like heat over a summer road. Every leaf has edges you have never seen before, and every edge is shimmering.",
"In the old songs this is the shore of the lotus-eaters. A ship’s crew once came ashore here for water, and the people of the island offered them a honey-sweet flower. Those who tasted it forgot everything: their homes, their names, the voyage itself. They wanted only to lie on the warm sand and taste again. Their captain had to carry them back to the ship weeping, bind them beneath the benches, and row away before the scent reached him too.",
"The island is not a trap, and the lotus is not poison. It is the first gift of the voyage: to see again, as a child sees, how unbearably beautiful the world is when you are wholly inside your senses. Colour becomes a language. Music becomes a body. Time loosens its grip. Let yourself be astonished here. You have been living in a grey copy of this island all your life.",
"But remember the crew beneath the benches. The danger of the Lotus Shore is not that it will hurt you. It is that it is enough. Many voyagers spend every journey on these beaches, chasing the next pattern and the next rush of colour, and never discover that the island has an interior, that the interior leads to the sea, and that the sea leads home.",
"So walk the shore with open eyes, and then, when you are ready, close them. Let the colours keep playing behind your eyelids and follow the music inward. Ask your body where it holds what you usually ignore. The senses are a door, not a room. Walk through it."]},
memory:{title:"The Two Springs",epi:["I am a child of Earth and starry Heaven.","from the Orphic gold tablets"],tale:[
"In the old mysteries the dead were buried with thin sheets of gold, and on the gold were written directions for the journey after death. They spoke of a dark hall and two springs. Beside the first, under a white cypress, the thirsty souls crowd to drink, and as they drink, they forget. Pass it by, the tablets say. Go further, to the cold water flowing from the Lake of Memory, and say to its guardians: I am a child of Earth and starry Heaven; I am parched with thirst; give me to drink.",
"The Isle of Memory is the land of that second spring. Its keeper is Mnemosyne, mother of the Muses, the goddess who forgets nothing. Here the past does not lie flat like a photograph. It rises around you, full of smell and weather: the kitchen of your childhood, a voice calling you in from the garden, the exact light of a day you had forgotten you lived.",
"Not all of it is gentle. Mnemosyne does not choose what she gives back. The island holds the warm rooms and the cold ones, the people who loved you and the ones who could not, the words never said and the losses never mourned. Many travellers fear this island for that reason, and sail around it for years.",
"But the tablets were clear about which spring to drink from. Forgetting is easy, and it costs everything. Remembering is hard, and it gives you back to yourself. Whatever returns here returns because it is ready to be seen with the eyes you have now, which are older and kinder than the eyes you had then.",
"Walk this island slowly. When a memory rises, do not narrate it; feel it. Let the feeling move through you like weather over a field. And when you meet your younger self on some path in the hills, as almost everyone does, kneel down to their height and ask what they needed. You may be the first person who ever asked."]},
shadow:{title:"The Gorgon and the Mirror",epi:["What you turn to face, you no longer face alone.","cut into the stones of the Bridge of Courage"],tale:[
"The western half of this island is a land of black rock and dead trees, where the wind smells of ash and something watches from every cave. The eastern half, beyond the river, rises in golden heights where a citadel catches the first sun. Travellers who see the island from the sea think they are looking at two islands. They are not. It is one land, and the road through the dark is the only road to the light.",
"In the deepest cave of the west lived the Gorgon, whose gaze turned every living thing to stone. Heroes came to kill her and became statues along the path. The young Perseus came too, and he was as afraid as any of them. But Athena gave him a gift: a shield polished like a mirror. He did not look at the Gorgon directly. He looked at her in the bright bronze, and in the mirror she was only a creature: terrible, yes, but finite, and very sad.",
"Here is what the old story whispers and the hero tales forget. The Gorgon was not born a monster. She was a young woman wronged by a god and punished for it, and her terrible face was the shape her pain had taken. Most fears are like this. They were made to guard something that was once hurt. Beneath the snakes there is nearly always something that needed you.",
"And here is the ending that matters. Perseus did not throw the Gorgon’s head into the sea. He gave it to Athena, and she set it on her shield, where it became the strongest protection in the world. What you face does not vanish. It changes sides. The fear you meet with open eyes becomes the strength you carry.",
"So cross this island at the pace of your courage. You may come back many times; the caves will wait. Take the mirror, your breath, your watcher, the gentle part of you that can look without flinching, and walk toward the dark. Somewhere in the west there is a cave with your name above its mouth. Somewhere in the east there is a citadel that is already yours."]},
heart:{title:"The Oak and the Linden",epi:["Every stranger at your door may be a god in disguise.","a saying of the market town"],tale:[
"Long ago two gods came down to walk among mortals, dressed as poor travellers. They knocked at a thousand doors in a rich town and were turned away from every one. At last they came to a small cottage at the edge of the hill, where an old couple named Philemon and Baucis lived with almost nothing. The old pair welcomed them in, warmed water for their tired feet, and set before them everything they had: cabbage, a little bacon, a jug of cheap wine.",
"Then the jug refilled itself. However much they poured, it was never empty. The old couple understood who sat at their table, and they were afraid, and then they were glad. The gods asked what they wished for. They asked only that neither should ever have to live without the other. When their time came, they were turned into two trees, an oak and a linden, rising from a single root, their branches woven together.",
"The Isle of Connection is the land of that story. Here every face you meet may be a god in disguise, and every one of them is also simply a person, as frightened and as hopeful as you. The walled town on the hill is busy with strangers. The grove on its northern edge is full of trees grown into one another. The wind carries bread and woodsmoke and other people’s lives.",
"Many travellers feel it here as a warmth in the chest that keeps on widening: love for the people they have, an ache for the people they lost, sudden understanding for someone they have resented for years. Some feel joined to everything at once, the sea, the stones, the gulls overhead. Let that warmth widen. It is not an illusion. It is a glimpse of how things have always been.",
"But remember the jug that never emptied. Connection is not a feeling you hold; it is something you pour. On this island you will be asked what you are willing to give, whom you are willing to forgive, and whose door you have been walking past. Note the promises your heart wants to make. Keep the true ones in the morning."]},
purpose:{title:"The Stone and the Mountain",epi:["One must imagine Sisyphus happy.","Albert Camus"],tale:[
"Beneath the halls of Hades, as far below the earth as the sky is above it, lies Tartarus: a land of black stone, red rivers and smoke. Here the gods sent those who had defied them, and among them the cleverest of all mortals, King Sisyphus, who cheated death twice. His punishment was simple. He must push a great boulder up a mountain, and each time he neared the top the stone rolled back to the bottom, and he walked down after it to begin again. Forever.",
"For a long time this was told as the most hopeless story in the world. Then a philosopher looked at it once more and noticed the walk down. In those moments, between one climb and the next, Sisyphus is free. He knows exactly what his task is. He has no illusions left. And the philosopher wrote that the struggle toward the heights is itself enough to fill a human heart. One must imagine Sisyphus happy.",
"The Isle of Tartarus is where travellers come when they are asking the hardest question of purpose: what is all of this for? The fire here burns away every borrowed answer, the life you were told to want, the success you chase out of fear, the goals that are really someone else’s. What survives the fire is what is truly yours.",
"It is not only a place of punishment. At the black river the ferryman waits, asking the price of every crossing. The god of the forge works day and night, tempering what is real and melting what is not. And in one corner of the ash a garden grows: the garden of Persephone, who blooms back into the world every spring after half a year in the dark. Even here, things return.",
"Do not come here looking for a summit to reach once and for all. There is no final summit. There is the stone, and the mountain, and the walk down, and the choice, every single time, to set your shoulder to it again, or to put down a stone that was never yours. Ask yourself in the heat: which burden is truly mine? And what makes the climb worth it?"]},
mystery:{title:"The Hidden Grain",epi:["Blessed is the one who has seen these things.","said of those initiated at Eleusis"],tale:[
"For two thousand years, in a town near Athens, men and women walked once in their lives along the Sacred Way to the temple of the Mysteries. They fasted. They bathed in the sea. They drank a barley drink, the kykeon, whose recipe was never written down. Then they entered the great dark hall, and what they saw there they were forbidden ever to describe. Almost none ever did. Those who came back said only that they no longer feared death.",
"The Isle of Mysteries is the island of that hall. It is wrapped in fog and watched by ghosts; its forests are dark and its graves are old. Travellers who come here meet the symbolic world: animals that speak, figures older than history, spirals that seem to hold the shape of everything. Some meet something deeper still: the feeling of dying, of dissolving, and of being born again.",
"The story behind the Mysteries is the story of a mother and a daughter. Persephone was carried down into the underworld, and Demeter her mother searched the whole earth for her, and in her grief the fields withered and the world went cold. When the daughter returned, the earth bloomed. Death, the Mysteries taught, is not an ending but a descent, like a grain of barley into dark soil. What goes down comes up changed.",
"On this island, do not try to understand too quickly. Symbols speak before they explain. If a figure appears, a mother, a warrior, a trickster, a wise old one, let it speak in its own language. If you feel yourself dissolving, do not cling to the edges. A great many initiates passed through that dark hall before you and walked out into the dawn.",
"And when you return, keep what you saw as poetry, not prophecy. The Mysteries were never about believing something new. They were about seeing something, and then going home and living as one who has seen. Ask yourself at the gate: what in me is ready to die, so that something else can be born?"]},
source:{title:"The River Around the World",epi:["It is wise to agree that all things are one.","Heraclitus"],tale:[
"The old Greeks drew the world as a round disc of earth, and around it they drew a river: Okeanos, the stream that flows around everything, from which all waters come and to which all of them return. It has no source and no mouth. It has no far shore. Sailors who reached it, the stories say, stopped steering.",
"At the heart of this realm lies the same sea. It cannot be found on purpose; every chart of the realm leaves it blank and writes only: Sea Without Shores. Travellers do not sail here. They are brought, sometimes, when they have stopped trying to arrive anywhere at all.",
"Those who have been here speak of it haltingly. The border between you and the room goes quiet, then the border between you and others, then the border between you and everything. There is light without a source. There is love without an object. There is the sense, beyond any argument, that everything is as it should be. And then there are no more words, and the stories stop.",
"If this sea receives you, do not grasp at it. Grasping is the one thing it will not allow. Do not decide afterwards that you have become enlightened, either; that is only another way of grasping. Let it pass through you the way light passes through water.",
"And when you come back to your own small shore, keep one question for the ordinary days ahead: what did I know there that I forget here? The answer does not have to be remembered. It only has to be lived a little: in silence, in time spent under the open sky, in the way you look at the next stranger who crosses your path."]},
integration:{title:"The Oar Planted Inland",epi:["Every voyage ends where it began, and the traveller sees it for the first time.","written above the Harbour of Return"],tale:[
"After ten years of war and ten more years at sea, the great wanderer woke at last on the shore of his own island and did not recognize it. Everything looked strange. A goddess dressed as a shepherd boy had to tell him he was home. And even then, home was not simply waiting for him. There was a house full of trouble to set right, a son grown into a stranger, and a wife who would not believe it was him until he spoke of a secret only they shared: the bed he had built around the living trunk of an olive tree.",
"Return is the longest part of every voyage. The Shores of Return are warm and green, with palms and quiet beaches and slow turquoise water, and that is no accident: what you bring back needs gentleness, rest and time. Many travellers expect to come home changed in an instant. Instead they find that change is a garden, not a lightning bolt.",
"While the wanderer was away, his wife wove a great cloth by day and unpicked it by night, to keep the world waiting until he came home. Integration is like that weaving: a little each day, undone and redone, until the pattern holds. You will forget. You will remember. You will forget again. That is not failure. That is weaving.",
"There was one more thing the wanderer had been told by the prophet in the underworld. When he was home at last, he was to take an oar and walk inland, far from the sea, until he met someone who did not know what an oar was and mistook it for a winnowing fan. There he was to plant the oar in the ground and make an offering. Only then would his journey truly end.",
"That is the work of this shore. Carry the oar of your voyage inland, into the ordinary country of your life, into a Tuesday, a kitchen, a conversation with someone who has never seen the sea, and plant it there. Not as a trophy, but as a seed. What will you do differently because you went? Choose one thing. Then let it grow."]}
};
const PTALES={
chart:["In the Chart House the walls are covered with charts no one has finished. Every traveller who ever sailed from this harbour left one behind: a single question inked at the top of an empty sea. Some are bold, some barely legible, some crossed out and rewritten a dozen times. The keeper of the house hands you a fresh sheet and a pen that never runs dry, and then she leaves the room, because a true question cannot be written while someone is watching.","Write slowly. Cross out the questions that are really orders. Keep the one that makes your chest go quiet when you read it back; that is the one the prow will hear. Fold the chart once and carry it aboard. You will not need to read it again out at sea. It will already have done its work."],
lighthouse:["The lighthouse does not shine out over the water. Its lamp turns inward, into the heart of whoever climbs the stair. Halfway up there is a landing with a narrow window, and travellers say the view from it shows the weather of your own mind: the low cloud of tiredness, the undertow of an argument, the bright hope you have pinned on tonight.","The keepers have one rule. You may not climb the last stair until you have looked honestly from that window. If the sky inside is heavy with storm, there is no shame in waiting for another night; the sea is not going anywhere. A voyage begun from a rested and willing mind sails twice as far as one begun in flight."],
garden:["Behind high stone walls lies a garden where nothing is accidental. The roses were planted where the light falls softest at dusk. The bench faces away from the road. The fountain was tuned, stone by stone, until its sound became the sound of being safe.","This is the art of setting: choosing the place that will hold you when you can no longer hold yourself. The old gardeners say the walls matter more than the flowers. Close what needs closing, the door, the phone, the noise of the world. Then gather what is gentle: a blanket, water, an eyeshade, the music you trust. You are making a cradle for a mind that is about to become very large and very young at once."],
guidetower:["On the headland stands a tower with one window and a lamp that never goes out. In the stories, the one who keeps it is never the hero. They do not sail, they do not seek visions, they do not even sleep. Their whole task is to remain: sober, steady, kind, and there.","Choose this person before you choose anything else. Speak with them by daylight about what may happen: whether and how they may touch you, which words will help, what they will do if the sea turns dark. A sailor who knows a lamp is burning on the shore can afford to go much further out."],
customs:["Every ship passes the Customs House, and no bribe works there. The officers open each crate and ask the dull questions the sea will never ask: Is the heart strong? Which medicines are aboard? Has anyone in your family been lost to madness? Does the law of your land forbid this voyage?","It is tempting to hurry past them. The myths are full of travellers who did, and the sea took them for it. Answer honestly here, even when the answer means the voyage must wait. Waiting is not failure. It is how sailors grow old."],
port:["At the end of the longest pier hangs a bell. Every traveller rings it once, then unties the last rope with their own hands. The old ones called this the release: you read your question one final time, and then you let it go, the way you open your hands and let go of a bird.","Breathe out longer than you breathe in. Feel the deck beneath you. You have prepared what could be prepared; the rest belongs to the sea. Trust, let go, be open. The ship knows the way better than any map."],
whirl:["It begins as a small curiosity: why did that happen, what does it mean, what does the meaning mean. Then the water starts to turn. The thoughts circle faster and faster around a hollow centre until the whole sea seems to be draining into one dark question. Many ships have spun here for hours, their sailors explaining the voyage to themselves instead of living it.","The way out is not another thought. Let the oars go slack. Feel the weight of your body and the slow pull of your breath. Return to the music, which has been playing all along. You can chart the whirlpool tomorrow, from dry land, with a cup of tea in your hands. Tonight, let it be only water."],
storm:["There is a storm on this sea that feeds on struggle. Fight the waves and they rise higher; curse the wind and it doubles. The sailors who try hardest to hold the sea still are the ones thrown about the most. The storm is not trying to drown you. It is showing you how tightly you grip.","Loosen your hands. Let the ship ride the swell instead of breaking against it. Say inwardly, as the old pilots did: this too is the voyage; this too will pass. Take the hand of your watcher. Storms on this sea last exactly as long as they are fought, and then a little longer, and then the sky clears in a way you will remember for years."],
fog:["Here the fog is so thick you cannot see the prow from the helm. Travellers forget where they are, then when, then who. Some say the fog is the oldest thing in the realm, older than the islands, and that every soul passes through it before it learns its own name.","Do not try to see through it. Find what is near: the boards under your feet, the warmth of your hands, a voice you trust saying your name. Name one thing you can touch. The fog does not lift because you understand it. It lifts because you stop running and stand still long enough for the sun to find you."],
sirens:["These sirens do not sing of wonders. Their song is smaller, and therefore more dangerous: check the time, answer the message, get up and do something, just glance at the world for a moment. Each note pulls you back toward the shallows, and a voyage interrupted a hundred times never reaches deep water.","Do as the wise captain did and put the wax in your ears before you sail: phone away, door closed, eyeshade on. When the song still comes, as it will, let it pass the way music passes from another room. You are tied to the mast. Keep rowing."],
rocks:["Beautiful things wash up on these rocks: a feeling of perfect love, a vision of light, a sentence that seems to explain everything. Travellers climb out to hold them, and the tide comes in, and the stones are sharp. Nothing grasped on this sea can be kept.","Let the beautiful thing go by like a lantern on the current. Bless it, watch it, release it. Whatever was true in it will wash up again on the shore of your journal when you need it. The sea gives its gifts only to open hands."],
prism:["High above the shore a waterfall pours over a ledge of crystal and breaks into every colour there is. The islanders say that Iris, the rainbow-messenger who carries word between the gods and the earth, comes here to bathe. Stand in the spray and the patterns begin: spirals within spirals, temples built of light, faces that dissolve the moment you see them.","Watch, but watch as a messenger watches. Iris never kept a message for herself. If one shape or colour keeps returning, it may be carrying word from somewhere deeper. Note it, and let it go on its way; later you can ask what it was trying to say."],
echoes:["They say the nymph Echo, who could only repeat what others said, faded into this hall until nothing was left of her but voice. Every sound you make here comes back changed: richer, older, sometimes in a language you almost understand. Music in this hall is not heard. It is entered, like a country with hills and rivers.","Let the music carry you, instead of the other way round. When a passage moves you to tears, do not ask why yet; stay with it. The hall remembers everything ever played inside it, and so, in time, will you."],
spring:["This spring does not bubble. It breathes: in, a long pause, out. The Greeks had one word, pneuma, for both breath and spirit, and travellers who sit here learn why. Watch the water rise and fall for long enough and you will find your own breath moving with it.","This is the oldest anchor in the realm. When the colours become too much, when fear stirs, come back to the spring. Breathe out longer than you breathe in. Notice how your breath changes when you feel safe, and when you do not. Every other place on this island can be reached from here, and every one can be left by returning."],
bodygrove:["In this grove the trees have warm bark, and when you lean against one you can feel a heartbeat, though you are never quite sure whose. This is where travellers discover that they have a body, often as if for the first time: heavy as stone, light as smoke, hot, cold, humming with currents that were there all along.","Wander the grove of your own body. Where is it tight? Where does it ache with an old story? Where does it simply want to be held? The body keeps the records the mind would rather lose. Listen to it the way you would listen to an old and wise animal."],
clock:["A great clock once stood here, the pride of the island, until time itself grew tired of being counted and broke it apart. Its hands still lie in the grass, pointing in different directions. Travellers say a minute in these ruins can last an evening, and an hour can pass like a single breath.","The Greeks had two gods of time: Chronos, who counts, and Kairos, the right moment, who has a lock of hair at the front and none at the back, so that you can only catch him as he comes toward you. Here Chronos sleeps. Sit among the ruins and ask: what would change in my life if I stopped hurrying?"],
village:["The streets of this village rearrange themselves into the town where you grew up. The shop is where it was, the gap in the fence is still open, and someone has left a bicycle leaning exactly where you used to leave yours. Children play in the square, and if you watch long enough, one of them looks up and is you.","Do not hurry past. Sit on the low wall and watch that child. What were they afraid of? What did they love so much it hurt? What did they decide, very early, about how the world works, that you are still living by? The village keeps those decisions written on its doorposts, waiting for someone grown to come back and read them."],
ancestors:["The trees in this grove are older than any family name. Their roots grip each other underground so tightly that no one can say where one tree ends and the next begins. Lay your ear against the bark and you will hear voices: a grandmother humming, a great-grandfather you never met cursing the weather, someone praying in a language your family no longer speaks.","Each of them handed something down: a laugh, a fear, a way of setting the jaw when angry. Some of it is treasure. Some of it is a weight that was never yours to carry. Walk among the roots and ask which patterns you will keep, and which you are ready to set down, gently, here, where they belong."],
hearth:["At the heart of the island stands a house built around a fire that never goes out. This is the hearth of Hestia, eldest of the Olympians, the goddess who never left home; every family that ever lived first lit its fire from hers. Inside, the table is laid for the people who raised you, as they were, not as you wished they had been.","Sit at the table. You may feel the old warmth, or the old silence, or both at once. Say, in the quiet of your heart, what you have never said aloud. You never have to say it to them in the waking world. The fire has heard it, and that is often enough to begin changing everything."],
archive:["A tall tower on the eastern shore is filled, floor upon floor, with letters that were never sent: apologies, confessions, farewells, love declared too late or not at all. The archivist is a quiet old woman who knows where every letter lies, and she will bring you yours without being asked.","Some are addressed to people who are gone. Some to people who are still here and do not know. One or two are addressed to you. Read them. Write the one that is missing. Whether you ever send it is a question for another day; what matters is that the words finally exist somewhere outside your chest."],
tears:["In the middle of the island lies a lake so clear you can see to the bottom, and the bottom is covered with small smooth stones, each one a grief that someone carried here and set down. The water is salty and warm. Travellers who wade in find they are weeping before they know why.","Let it come. Grief that is not wept turns to stone in the body; grief that is wept becomes water again, and water moves. If an old loss rises, a person, a place, a life that never happened, wade in with it. The lake has room for all of it, and it has never once run dry."],
cavesfear:["The mouth of the cave is low, and you must stoop to enter. Inside, two red eyes open in the dark, and every fear you came to meet is waiting, along with a few you did not expect: the dread of being abandoned, of being found out, of vanishing, of being too much or never enough.","Do not run, and do not attack. Hold up the mirror of your attention and look at the fear without looking away. Ask it: what are you, and what are you protecting me from? Then wait for its answer. Often the red eyes blink and grow smaller, and you find yourself face to face with something young and frightened that has been guarding the door for years."],
mire:["Here the ground gives way. Every step sinks, and the deeper you sink, the louder the voices in the mud become: you should have, how could you, everyone can see. Travellers who stand still and listen are slowly swallowed to the chest.","Shame speaks in borrowed voices. Listen closely and ask whose voice it really is: a parent, a teacher, a playground, a whole culture. Then lie back. It is the oldest secret of the marsh: those who stop struggling float. Let the mud hold you, look up at the sky, and say to yourself what you would say to a friend who was sinking here."],
crags:["A volcano broods above the western shore. Lava runs down its flanks in bright rivers and the air shimmers with heat. This is where anger lives: old rage, fresh frustration, the burning sense that something was unfair. Travellers either flee the heat or are consumed by it.","There is a third way. Stand at a safe distance and warm your hands. Anger is fire, and fire is a tool before it is a disaster: it marks a boundary that was crossed, a value that was trampled. Ask the mountain what it is defending. Then you can choose what to forge with that heat, instead of letting it burn down the forest."],
bridge:["Between the two halves of the island runs a dark river, and over it a single stone bridge. Halfway across, the bridge seems to end in empty air. Most travellers stop there. The few who take one more step discover that the bridge goes on; it was only invisible to those who would not walk it.","Courage is not the absence of fear. It is the step you take while afraid, with shaking knees. You do not have to cross the whole bridge today. Ask only: what is the smallest brave step I could take? Take that one. The stones appear beneath the feet of those who walk."],
citadel:["On the golden heights stands a citadel no army ever built. Its walls were raised stone by stone from every hardship its owner survived. When travellers reach the gate they are surprised: the citadel is theirs, it has always been theirs, and its towers are made of the days they thought had broken them.","Walk the walls. Touch the stones and remember the illness you came through, the loss you lived past, the night you thought would never end. You are not as fragile as your fear believes. Strength is not something you must earn on this island. It is something you finally recognize."],
well:["Beside the citadel there is a well whose water tastes different to everyone. To one it tastes of a mother’s kitchen, to another of rain on a mountain, to another of a friend’s laughter. Whatever refills you after hardship, this well remembers it.","Drink, and pay attention to the taste. Strength is not an endless store; it is a well that must be filled again. Ask what gives you strength back: who, which places, which practices, which people. The answer is a map you can use long after the voyage is over."],
lovegrove:["Here the oak and the linden still stand, risen from one root, and around them a whole grove has grown the same way: trees that leaned toward each other until they could no longer be parted. Their leaves are red and gold in every season, and the light beneath them feels like being held.","Stand between the two old trees and let love find you, given and received. Then notice where it stops. Every heart has a place where it closes, a door where love knocks and is turned away. Find that door in yourself. You do not have to open it today. Only knock, softly, and listen to who answers."],
forgive:["A stone bridge crosses the stream west of the town. Travellers who pause at its middle often find they are carrying a stone they did not know about: a grudge, an old injury, a name they cannot say without tightening. The stream below is full of such stones, worn smooth by the water.","Forgiveness is not saying it did not matter. It is putting down a weight you were never meant to carry forever. Hold the stone. Feel its weight and what it has cost you. When you are ready, and not before, let it fall into the stream. Some travellers find that the hardest stone to let go of is the one with their own name on it."],
market:["Inside the walls the market never closes. Every stall is kept by someone you know or once knew, and every one of them sells the same thing: a glimpse of the world through their own eyes. A sharp-tongued neighbour shows you her loneliness. A parent shows you their fear. The one you misunderstood most shows you exactly why.","Walk slowly between the stalls. Ask each keeper, in silence: what is it like to be you? Look for the god behind the disguise, as Philemon and Baucis did. Empathy is not agreeing with everyone. It is letting their world become as real to you as your own."],
gratitude:["At the foot of the hill stands a small white temple where travellers leave offerings, not of gold but of small and ordinary things: a cup of tea, a morning walk, a friend’s voice on the phone. Inside it is very quiet, and very bright.","Sit on the steps and count what is already given: the roof over you, the breath in you, the people who stayed. Gratitude is the jug that never empties; the more you pour from it, the more there is. Before you leave, lay on the altar one ordinary thing you usually walk past without seeing."],
summit:["The mountain rises out of the ash, scarred with rivers of fire. Halfway up, a small figure is pushing a stone. If you climb close, he will look at you, not in despair but with a strange calm. He has been doing this for a very long time. He has had time to think.","Ask him what he thinks about on the way down. Then turn the question on yourself: looking back from the very end of your life, what will have mattered? Which efforts were worth every return to the bottom, and which stones did you push only because someone once told you to? The mountain never answers for you. It only makes the question impossible to avoid."],
crossroads:["On the black river Styx a silent ferryman waits in a narrow boat. The dead of old were buried with a coin beneath the tongue to pay him; those who had nothing wandered the bank for a hundred years. Every crossing in this realm costs something. That is the first law of the underworld, and the last law of every real choice.","You stand at the water’s edge because a decision is waiting. Which path are you already walking, and which one are you avoiding? What would crossing cost you: comfort, approval, a version of yourself you are fond of? Pay it with open eyes, or choose not to cross; either is a choice. Wandering the bank for a hundred years is the only thing the ferryman pities."],
forge:["The lame god of the forge was thrown from Olympus as a child, and in the burning places beneath the world he made the most beautiful things the gods ever owned. His forge still roars here. Into its fire go the values you say you hold, and only some of them come out whole.","Bring your values to the anvil: honesty, freedom, kindness, courage, whatever you claim. Watch which ones you truly live, and which melt when life grows hot. Do not be ashamed of what melts; that metal can be worked again. What survives the forge is the blade you will carry for the rest of the voyage."],
seeds:["In a hidden hollow where the smoke thins, pomegranate trees grow among pale asphodel. The queen of the underworld planted them. She was carried down here against her will, she ate six pomegranate seeds, and so must spend part of every year below. But every spring she returns to the light, and the whole earth blooms to greet her.","This garden is the promise that nothing in you is so burned that it cannot grow again. What small thing could you plant this month that would come back every year? A habit, a practice, a promise small enough to keep. Plant it here, in the ash, where it has nothing to prove."],
deathgate:["In the fog stands a gate of two dark towers and a pointed arch, and through the arch glows a pale green light. Travellers who pass beneath it often feel a great dissolving: the edges of the self go soft, the name falls away, and for a while there is nothing to hold on to.","This is the oldest passage in the realm, and the most feared. The initiates of the Mysteries spoke of it as dying before death. Do not cling to the doorposts. Breathe, let go, and keep walking. On the far side there is always a dawn, though no one has ever managed to describe it. Ask the gate before you pass: what am I ready to let die?"],
archetypes:["The dark castle on the hill is the temple of the great figures: the Mother, the Warrior, the Trickster, the Wise One, the Lover, the Destroyer. They are older than any god with a name, and every myth in the world is a costume one of them once wore. Their windows glow green through the fog.","If one of them comes to meet you, bow, and listen. They do not care about your opinions; they care about which of them you have been ignoring. Ask the one who visits: what do you want from me? What have I refused to become? The answer may change the shape of your life more than any vision of light."],
labyrinth:["A ring of standing stones guards a labyrinth cut into the ground. The Minotaur once lived in such a maze, and the hero Theseus found his way out only by following the thread Ariadne gave him. This labyrinth has no monster at its centre. It has something stranger: you.","Walk the spiral and notice where you keep turning back, which thoughts you keep circling. In a true labyrinth there are no wrong turns; every path leads, in the end, to the centre. Ask: what is the centre I keep circling? Then hold your thread, the breath, the music, your watcher’s voice, and let it lead you in, and out again."],
totem:["In this wood the trees have eyes. Owls watch from bare branches, and other creatures move between the trunks: a stag, a serpent, a wolf, a hare. In the old world every god had a creature, Athena her owl, Apollo his raven, Artemis her deer, and travellers who come here are often met by one.","If an animal appears and walks beside you, ask what it carries. The creatures of this wood are parts of you that never learned to speak in words: instinct, wildness, watchfulness, play. If this animal were part of you, which part would it be? And what does it want you to remember about how to live?"],
clearlight:["The old books of the dead describe a moment when the clear light dawns, before any vision, before any god or demon: bright, empty, utterly calm. The initiates of Eleusis would have known it as the moment of seeing what cannot be told. It rests at the centre of the realm, and every island turns slowly around it.","There is nothing to do here, and that is the hardest instruction in the whole atlas. Rest. If a question arises, let it be this one: what remained when “I” was quiet? The answer is not a thought. It is the space the thoughts float in."],
returnport:["The ship comes in slowly, as ships do after long voyages, and the harbour is gentle. There are blankets on the quay, warm bread, fresh water, someone waiting. Travellers who step ashore often find their legs unsteady, the ground still rolling like the sea beneath them.","Do not rush inland. The first hours and days after a voyage are tender. Eat, rest, stay warm. Write or draw a little, without explaining anything. Ask yourself only: what do I need right now to feel safe and grounded? Let the sea settle in you before you begin to tell its story."],
scriptorium:["In a tall tower above the bay, scribes of no particular faith copy out the voyages of everyone who comes home. Their desks are covered in ink and gold leaf. They do not judge what you saw. They only ask you to tell it as clearly and truly as you can.","Sit at an empty desk and write. Not the whole voyage, not yet: begin with three words that hold it. Then a page. Draw a shape where words fail. A voyage that is written down can be visited again; a voyage that is only remembered slowly drifts back out to sea."],
gardens:["Behind the hearth-house, walled in hedge, lie six gardens, each tended by a different gardener: the garden of the Mind, of the Body, of the Spirit, of the people you love, of the way you live, and of the wild world. Every traveller who returns is handed a few seeds for each.","Walk through all six. Notice which has run wild, which is thriving, which you have quietly neglected for years. You do not have to tend them all at once. Choose one seed for one garden, small enough to plant this week, and plant it. The gardeners say a single tended bed changes the soil of the whole estate."],
council:["On the beach, as night falls, travellers gather around a fire and tell each other where they have been. No one interrupts. No one explains anyone else’s voyage to them. When one has finished speaking, the others say only: we hear you.","You were never meant to carry this alone. Who can you tell, honestly, without needing them to understand everything? A friend, a circle, a therapist who knows these waters. Speaking a voyage aloud to someone who listens is one of the oldest medicines in the world. It turns a private vision into a shared story, and shared stories can be lived."],
homehearth:["At the end of every road on this island stands a house with a fire burning, and when you open the door you find it is your own house, exactly as you left it: the dishes, the unanswered letters, the ordinary Tuesday waiting. Nothing outside has changed. That is the point.","This is where the voyage becomes real, or fades. Ask: what will I do differently on an ordinary Tuesday? Not someday, not when life is calmer, but this Tuesday. The wanderer did not end his journey on the sea. He ended it at home, beside the bed he had built around a living olive tree."]
};
/* ---------- the book: each island a chapter, each place a tale ---------- */
const ORN=`<svg class="orn-rule" viewBox="0 0 160 14" aria-hidden="true"><path d="M6 7H60M100 7H154" stroke="#8c7a55" stroke-width=".8"/><path d="M60 7q9-7 15 0q-6 7-15 0zM100 7q-9-7-15 0q6 7 15 0z" fill="none" stroke="#8c7a55" stroke-width=".8"/><path d="M80 1.2l5.8 5.8-5.8 5.8-5.8-5.8z" fill="#9b2f24" stroke="#4a2a14" stroke-width=".6"/><circle cx="80" cy="7" r="1.4" fill="#e9d29a"/></svg>`;
const paras=a=>a.map(p=>`<p>${esc(p)}</p>`).join("");
const crestOf=r=>`<svg class="crest" viewBox="-13 -15 26 31" aria-hidden="true">${shieldSVG(r.color,r.em)}</svg>`;
const MINE_TALE=["This place was on no chart until you found it. No myth has been written about it yet; that is your work. Whatever you met here, a face, a fear, a strength, a door, belongs to this shore now.","Write it into the Journal while it is still warm, and spin its echoes into the Web. Over many voyages this page will fill with your own story, and the realm will be a little larger because you were here."];
function islandChapter(r,tome){const T=TALES[r.id]||{},titles=r.roadT||ROADT,roman=["I","II","III","IV","V","VI"];
 let h=`<header class="chap">${crestOf(r)}<p class="runhead">${esc(r.level)}</p><h2>${esc(r.name)}</h2>${T.title?`<p class="chap-sub">${esc(T.title)}</p>`:""}${ORN}`;
 if(T.epi)h+=`<blockquote class="epi"><p>“${esc(T.epi[0])}”</p><cite>${esc(T.epi[1])}</cite></blockquote>`;
 if(!tome)h+=`<button class="tomebtn" data-tome>${BOOK_ICON}Open the Great Book</button>`;
 h+=`</header>`;
 if(T.tale)h+=`<div class="tale" style="--ic:${r.color}">${paras(T.tale)}</div><div class="fleuron">${ORN}</div>`;
 h+=`<aside class="marg"><span class="marg-h">From the margins of the atlas</span>${esc(r.blurb)}</aside>`;
 h+=`<h3 class="sect"><span>The Road</span></h3><ol class="verses" style="--ic:${r.color}">`+r.road.map((t,i)=>`<li><span class="vn">${roman[i]}</span><p><em>${esc(titles[i])}.</em> ${esc(t)}</p></li>`).join("")+`</ol>`;
 return h}
function placeTale(r,p,tome){const t=PTALES[p.id]||(p.mine?MINE_TALE:null),q=p.q||(p.mine?"What did I find in this place, and what did it want me to see?":"");
 let h="";
 if(t)h+=`<div class="tale" style="--ic:${p.mine?"#2d58a8":r.color}">${paras(t)}</div>`;
 if(q)h+=`<div class="ask"><span>${r.sea?"The anchor":"The question this place asks"}</span><p>${esc(q)}</p></div>`;
 if(p.more)h+=`<aside class="marg"><span class="marg-h">From the harbour records</span>${esc(p.more)}</aside>`;
 return h}
function placeChapter(r,p){const lit=state.lanterns.includes(p.id);
 let h=`<header class="chap">${crestOf(r)}<p class="runhead">${p.mine?"A place you found":r.sea?"A hazard of the sea":"A place"} ${r.sea?"":"on the "+esc(r.name)}</p><h2>${esc(p.name)}${lit?' <span class="litmark" title="Lantern lit">✦</span>':""}</h2>${p.line?`<p class="chap-sub">${esc(p.line)}</p>`:p.mine&&p.at?`<p class="chap-sub">found on ${esc(p.at)}</p>`:""}${ORN}<button class="tomebtn" data-tome>${BOOK_ICON}Open the Great Book</button></header>`;
 h+=placeTale(r,p);
 h+=`<div class="btns"><button class="btn dark" data-go="journal">Journal</button><button class="btn" data-go="web">Thought web</button><button class="btn ${lit?"on":""}" data-lantern="${p.id}">${lit?"Lantern lit":"Light a lantern"}</button>${p.mine?`<button class="btn warn" data-rm="${p.id}">Remove</button>`:""}</div>`;
 h+=`<button class="backlink" data-back>Return to the tale of the ${esc(r.name)}</button>`;
 return h}
const BOOK_ICON=`<svg viewBox="0 0 24 18" aria-hidden="true"><path d="M12 4C9 2 5 1.5 1.5 2.2V15.6C5 15 9 15.4 12 17.2C15 15.4 19 15 22.5 15.6V2.2C19 1.5 15 2 12 4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 4V17" stroke="currentColor" stroke-width="1.2"/></svg>`;
function roadHTML(r){
 const mine=state.places.filter(x=>x.region===r.id).map(x=>({...x,mine:true})),list=[...r.places,...mine],p=cur.place&&list.find(x=>x.id===cur.place);
 let h=p?placeChapter(r,p):islandChapter(r);
 const rest=list.filter(x=>!p||x.id!==p.id);

 ways.forEach((w,i)=>{w.el=els[i];w.ph=[...els[i].querySelectorAll(".ph")]});
 TRIP={ways,trail:tsv.querySelector(".trail")};return TRIP}
/* faint walkers going out along every way, step by step, before you choose */
function phantoms(on){clearInterval(phT);phT=0;if(!on||!TRIP)return;TRIP.ways.forEach(w=>{w.pi=-Math.floor(Math.random()*16);w.pk=0});
 phT=setInterval(()=>{if(walking||document.hidden||moving||!TRIP)return;TRIP.ways.forEach(w=>{w.pi++;if(w.pi<0)return;if(w.pi>=w.steps.length){w.pi=-Math.floor(8+Math.random()*18);return}
  const s=w.steps[w.pi],g=w.ph[w.pk++%w.ph.length],u=g.firstChild;g.setAttribute("transform",`translate(${s.x.toFixed(1)} ${s.y.toFixed(1)}) rotate(${s.a.toFixed(1)}) scale(1.22)`);u.setAttribute("href",s.l?"#fpL":"#fpR");
  if(u.animate)u.animate([{opacity:0,transform:"scale(1.25)"},{opacity:.8,transform:"scale(1)",offset:.1},{opacity:.62,offset:.45},{opacity:0}],{duration:2600,easing:"ease-out"})})},360)}
/* a footprint pressed into the parchment */
function stamp(g,s,col){if(col){const k=svgEl("circle",{cx:s.x.toFixed(1),cy:s.y.toFixed(1),r:"3",class:"spark",style:`stroke:${col}`});g.appendChild(k);if(k.animate)k.animate([{transform:"scale(.6)",opacity:.85},{transform:"scale(3.2)",opacity:0}],{duration:900,easing:"ease-out",fill:"forwards"}).onfinish=()=>k.remove();else k.remove()}
 const o=svgEl("g",{transform:`translate(${s.x.toFixed(1)} ${s.y.toFixed(1)}) rotate(${s.a.toFixed(1)}) scale(1.28)`}),u=svgEl("use",{href:s.l?"#fpL":"#fpR",class:"tp"});o.appendChild(u);g.appendChild(o);
 if(u.animate)u.animate([{opacity:0,transform:"scale(1.45)"},{opacity:.96,transform:"scale(1)",offset:.05},{opacity:.92,offset:.3},{opacity:.36}],{duration:8000,easing:"ease-out",fill:"forwards"});else u.style.opacity=.8}
/* the drift of the moving sheet from where it was last drawn, as a share of the view */
function camDrift(){const b=box(),sC=sOf(vbC),sV=sOf(vb);return Math.max(Math.abs((vbC[0]+vbC[2]/2-vb[0]-vb[2]/2)*sV)/b.w,Math.abs((vbC[1]+vbC[3]/2-vb[1]-vb[3]/2)*sV)/b.h,Math.abs(Math.log(sV/sC))/1.6)}
/* walk a way: footsteps appear one by one and the camera follows them to the island */
async function walkTo(rid){if(!TRIP||tripLock)return;const w=TRIP.ways.find(v=>v.rid===rid);if(!w)return;
 const run=++walkRun;walking=true;cancelAnimationFrame(walkRaf);camFollow=true;camHook=tripCamOff;phantoms(false);
 tsv.classList.add("walking");TRIP.ways.forEach(v=>v.el.classList.toggle("sel",v===w));TRIP.trail.innerHTML="";
 const col=(CRYS_COL[rid]||CRYS_COL.sea)[1],lamp=svgEl("circle",{r:"26",class:"lamp",cx:w.steps[0].cx.toFixed(1),cy:w.steps[0].cy.toFixed(1)});lamp.style.setProperty("--lc",col);TRIP.trail.appendChild(lamp);
 const red=reduceMotion(),WW=Math.max(ZMIN*1.5,Math.min(420,ZMAX)),s0=w.steps[0];
 caption("You walk toward the "+RMAP[rid].name+"…",{ink:1,hold:3600});
 if(!red)await camTo([s0.cx+s0.dx*40-WW/2,s0.cy+s0.dy*40-WW/AR/2,WW],1300,EZ.io);
 if(run!==walkRun)return;
 const SD=red?40:290,t0=performance.now();let shown=0,last=t0,cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2,ww=vb[2];
 await new Promise(res=>{const step=now=>{if(run!==walkRun)return res();const el=(now-t0)/SD,n=w.steps.length;
  while(shown<n&&shown<=el){stamp(TRIP.trail,w.steps[shown],col);shown++}
  {const i=Math.min(n-1,Math.floor(el)),j=Math.min(n-1,i+1),f=Math.min(1,el-Math.floor(el));lamp.setAttribute("cx",(w.steps[i].cx+(w.steps[j].cx-w.steps[i].cx)*f).toFixed(1));lamp.setAttribute("cy",(w.steps[i].cy+(w.steps[j].cy-w.steps[i].cy)*f).toFixed(1))}
  if(camFollow&&!red){const i=Math.min(n-1,Math.floor(el)),j=Math.min(n-1,i+1),f=Math.min(1,el-Math.floor(el)),a=w.steps[i],b=w.steps[j],px=a.cx+(b.cx-a.cx)*f,py=a.cy+(b.cy-a.cy)*f,dt=Math.min(64,now-last),kk=1-Math.exp(-dt/340),prog=Math.min(1,el/n),tw=WW*(1+.6*Math.max(0,(prog-.55)/.45));
   cx+=(px+a.dx*22-cx)*kk;cy+=(py+a.dy*22-cy)*kk;ww+=(tw-ww)*kk;vb=[cx-ww/2,cy-ww/AR/2,ww,ww/AR];moveVB();if(camDrift()>.17)commitVB()}
  last=now;if(shown>=n&&el>n+1.2)return res();walkRaf=requestAnimationFrame(step)};walkRaf=requestAnimationFrame(step)});
 if(run!==walkRun)return;
 if(lamp.animate)lamp.animate([{opacity:1},{opacity:0}],{duration:2200,fill:"forwards"});
 arrive(w);
 if(camFollow&&!red)await camTo(regionVB(rid),1600,EZ.io);
 if(run!==walkRun)return;
 walking=false;camHook=null;camFollow=false;tsv.classList.remove("walking");TRIP.ways.forEach(v=>v.el.classList.remove("sel"));
 go(rid,null,true);toast("You have reached the "+RMAP[rid].name);setTimeout(()=>{if(MODE==="trip"&&!walking)phantoms(true)},4000)}
/* arriving: rings spread from the last step and the island's name is written in red */
function arrive(w){const e=w.steps[w.steps.length-1],g=TRIP.trail,name=RMAP[w.rid].name;
 for(let i=0;i<3;i++){const c=svgEl("circle",{cx:e.cx.toFixed(1),cy:e.cy.toFixed(1),r:"5",class:"rip"});g.appendChild(c);if(c.animate)c.animate([{transform:"scale(.5)",opacity:.9},{transform:"scale(6.5)",opacity:0}],{duration:2400,delay:i*420,easing:"cubic-bezier(.2,.6,.3,1)",fill:"both"})}
 const t=svgEl("text",{x:e.cx.toFixed(1),y:(e.cy-17).toFixed(1),class:"insc","text-anchor":"middle","font-size":"15"});t.innerHTML=[...name].map((ch,ci)=>`<tspan style="--c:${ci}">${esc(ch)}</tspan>`).join("");g.appendChild(t);
 setTimeout(()=>{if(t.animate)t.animate([{opacity:1},{opacity:0}],{duration:1800,fill:"forwards"}).onfinish=()=>t.remove();else t.remove()},9000)}
/* ---------- the visions on the way in ---------- */
function mandala(k){const T=6.2832,f=v=>v.toFixed(2),g=[];
 const stops=["#ff2d6f","#ffb02d","#e8ff2d","#2dff8a","#2dd5ff","#7a2dff","#ff2dd5"].map((c,i,a)=>`<stop offset="${(i/(a.length-1)).toFixed(2)}" stop-color="${c}"/>`).join("");
 if(k===0){const r=17;g.push(`<circle r="${r}"/>`);for(let i=0;i<6;i++){const a=i/6*T;g.push(`<circle cx="${f(Math.cos(a)*r)}" cy="${f(Math.sin(a)*r)}" r="${r}"/>`)}for(let i=0;i<12;i++){const a=i/12*T+T/24;g.push(`<circle cx="${f(Math.cos(a)*r*1.93)}" cy="${f(Math.sin(a)*r*1.93)}" r="${r}" opacity=".55"/>`)}g.push(`<circle r="${r*3}"/><circle r="${r*3.15}" stroke-width=".3"/>`)}
 if(k===1){for(let i=0;i<24;i++)g.push(`<ellipse cy="-60" rx="4.6" ry="15" transform="rotate(${i*15})"/>`);let st="";for(let i=0;i<24;i++){const a=i/24*T-T/4,rr=i%2?52:74;st+=(i?"L":"M")+f(Math.cos(a)*rr)+","+f(Math.sin(a)*rr)}g.push(`<path d="${st}Z"/>`);let s2="";for(let i=0;i<16;i++){const a=i/16*T,rr=i%2?40:66;s2+=(i?"L":"M")+f(Math.cos(a)*rr)+","+f(Math.sin(a)*rr)}g.push(`<path d="${s2}Z" opacity=".7"/>`)}
 if(k===2){for(let i=0;i<72;i++){const a=i/72*T;g.push(`<circle cx="${f(Math.cos(a)*88)}" cy="${f(Math.sin(a)*88)}" r="${i%6?.9:2.2}" fill="url(#mg${k})" stroke="none"/>`)}g.push(`<circle r="94"/><circle r="81"/><circle r="97" stroke-dasharray="1 3"/>`);for(let i=0;i<36;i++){const a=i/36*T;g.push(`<path d="M${f(Math.cos(a)*81)},${f(Math.sin(a)*81)}L${f(Math.cos(a)*94)},${f(Math.sin(a)*94)}" stroke-width=".35"/>`)}}
 return`<svg viewBox="-100 -100 200 200" aria-hidden="true"><defs><linearGradient id="mg${k}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient></defs><g fill="none" stroke="url(#mg${k})" stroke-width="${k===2?.8:.7}">${g.join("")}</g></svg>`}
function buildFX(){const el=document.getElementById("tripfx");if(!el.dataset.built){el.dataset.built=1;
 el.innerHTML=`<div class="tf hue"></div><div class="tf mand m0"><div class="spin">${mandala(0)}</div></div><div class="tf mand m1"><div class="spin">${mandala(1)}</div></div><div class="tf mand m2"><div class="spin">${mandala(2)}</div></div>
  <div class="tf tun">${"<i></i>".repeat(7)}</div><div class="tf vig"></div><div class="tf flash"></div><div class="tskip">touch anywhere to skip</div>`;
 el.addEventListener("click",skipTrip)}
 el.className="tripfx";return el}
/* captions written across the map: glowing during the visions, red ink afterwards */
function caption(t,o={}){const c=document.getElementById("tcap");clearTimeout(capT);c.classList.remove("show");
 capT=setTimeout(()=>{c.textContent=t||"";c.classList.toggle("ink",!!o.ink);if(t){void c.offsetWidth;c.classList.add("show");if(o.hold)capT=setTimeout(()=>c.classList.remove("show"),o.hold)}},t?420:0)}
function waysVB(){const h=homeVB(),w=h[2]*.9;return[600-w/2,476-w/AR/2,w]}
function setModeBtn(){const b=document.getElementById("modeBtn");if(!b)return;const on=MODE==="trip";b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);
 b.title=on?"Tripping right now · touch to come back to sober":"Sober · touch if you are tripping right now";b.setAttribute("aria-label",b.title)}
/* ---------- entering the trip ---------- */
async function enterTrip(){const run=++tripRun,alive=()=>run===tripRun&&MODE==="trip";walkRun++;walking=false;cancelAnimationFrame(walkRaf);phantoms(false);
 MODE="trip";setModeBtn();wrap.classList.add("trip");buildWays();
 if(reduceMotion()){go("source",null,true);fly(waysVB());tsv.classList.add("show");caption("Choose your way, and follow the footsteps.",{ink:1,hold:5000});phantoms(true);return}
 tripLock=true;const fx=buildFX();fx.hidden=false;requestAnimationFrame(()=>{if(alive())fx.classList.add("on")});
 await camTo(homeVB(),900,EZ.io);if(!alive())return;
 /* breathe, at least once, and until the realm is fully painted */
 for(let b=0;b<6;b++){caption("Breathe in…");const hv=homeVB();fx.classList.add("in");
  await camTo([hv[0]+hv[2]*.035,hv[1]+hv[3]*.035,hv[2]*.93],1700,EZ.sine,(k,e)=>{inner.style.transform=`rotate(${(-2.5*e).toFixed(2)}deg)`});if(!alive())return;
  caption("…and let go.");fx.classList.remove("in");
  await camTo(hv,1700,EZ.sine,(k,e)=>{inner.style.transform=`rotate(${(-2.5*(1-e)).toFixed(2)}deg)`});if(!alive())return;
  if(painted())break}
 /* the fall into the source */
 caption("Let the realm draw you inward…");fx.classList.add("dive");
 await camTo([600-120,480-96,240],3400,EZ.in,(k,e)=>{inner.style.transform=`rotate(${(-17*e).toFixed(2)}deg) scale(${(1+.04*Math.sin(k*Math.PI*4)*(1-k)).toFixed(4)})`;if(k>.84&&!fx.classList.contains("flash"))fx.classList.add("flash")});if(!alive())return;
 /* at the bottom of the fall the book opens on the Sea Without Shores, and the stones take every colour */
 go("source",null,true);
 caption("Every way begins in the Sea Without Shores.");
 await wait(650);if(!alive())return;
 fx.classList.remove("dive");fx.classList.add("emerge");
 await camTo(waysVB(),3000,EZ.out,(k,e)=>{inner.style.transform=`rotate(${(-17*(1-e)).toFixed(2)}deg)`});if(!alive())return;
 inner.style.transform="";tsv.classList.add("show");
 await wait(500);if(!alive())return;
 caption("Choose your way, and follow the footsteps.",{ink:1,hold:6500});
 fx.classList.remove("on");tripLock=false;
 setTimeout(()=>{if(alive()){fx.hidden=true;fx.className="tripfx"}},1500);
 setTimeout(()=>{if(alive()&&!walking)phantoms(true)},2600)}
function skipTrip(){if(!tripLock)return;const run=++tripRun;cancelAnimationFrame(anim);anim=null;pendingCam=null;inner.style.transform="";tripLock=false;
 const fx=document.getElementById("tripfx");fx.className="tripfx";fx.hidden=true;go("source",null,true);vb=clampVB(waysVB());commitVB();tsv.classList.add("show");
 caption("Choose your way, and follow the footsteps.",{ink:1,hold:5500});setTimeout(()=>{if(run===tripRun&&MODE==="trip"&&!walking)phantoms(true)},2400)}
function exitTrip(){tripRun++;walkRun++;walking=false;cancelAnimationFrame(walkRaf);phantoms(false);camHook=null;camFollow=false;MODE="sober";setModeBtn();wrap.classList.remove("trip");
 if(tripLock){cancelAnimationFrame(anim);anim=null;pendingCam=null;commitVB()}tripLock=false;inner.style.transform="";
 const fx=document.getElementById("tripfx");fx.className="tripfx";fx.hidden=true;caption("");
 tsv.classList.add("gone");setTimeout(()=>{if(MODE==="sober"){tsv.innerHTML="";tsv.setAttribute("class","");TRIP=null}},700)}
document.getElementById("modeBtn").onclick=()=>{MODE==="trip"?exitTrip():enterTrip()};
setModeBtn();
</script>
